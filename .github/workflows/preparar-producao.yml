name: Preparar produção (Supabase)

# Execução manual (aba Actions → "Preparar produção (Supabase)" → Run workflow).
# Recria os dados de demonstração no banco de produção.
# ATENÇÃO: o seed APAGA todas as coleções da organização e recria os usuários de demonstração.
# As migrations (supabase/migrations) são aplicadas no projeto pelo painel/CLI do Supabase, não por este workflow.
#
# Segredos necessários (Settings → Secrets and variables → Actions, ambiente "producao"):
# - DATABASE_URL: conexão do papel interos_app pelo pooler (postgresql://interos_app.<ref>:<senha>@…:6543/postgres).
# - INTEROS_SEED_PASSWORD: senha dos usuários de demonstração (mínimo 10 caracteres).

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Para recriar os dados, digite APAGAR E RECRIAR"
        type: string
        default: ""

concurrency:
  group: preparar-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preparar:
    name: Dados de demonstração
    runs-on: ubuntu-latest
    # Rodando nos EUA, cada operação dos motores (comissões, KPIs) vai e volta até o banco em São Paulo.
    timeout-minutes: 60
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir segredos e confirmação
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTEROS_SEED_PASSWORD: ${{ secrets.INTEROS_SEED_PASSWORD }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$INTEROS_SEED_PASSWORD" ]; then
            echo "::error::Configure os segredos DATABASE_URL e INTEROS_SEED_PASSWORD no ambiente producao."
            exit 1
          fi
          if [ "$CONFIRMACAO" != "APAGAR E RECRIAR" ]; then
            echo "::error::Confirmação ausente. Digite exatamente: APAGAR E RECRIAR"
            exit 1
          fi

      - name: Recriar dados de demonstração
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTEROS_SEED_PASSWORD: ${{ secrets.INTEROS_SEED_PASSWORD }}
          INTEROS_ORGANIZATION_ID: intercert
        run: |
          npx tsx --conditions=react-server scripts/seed.ts
          npx tsx --conditions=react-server scripts/seed/verify.ts
